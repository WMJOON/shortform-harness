[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shortform-harness"
version = "0.1.0"
description = "Shortform video generation harness — style-consistent Korean lifestyle content"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.25",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
harness = "cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "orchestrator*", "eval*", "consistency*", "apo*"]

[tool.ruff]
line-length = 100
target-version = "py311"
